services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: nhal
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d nhal']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
